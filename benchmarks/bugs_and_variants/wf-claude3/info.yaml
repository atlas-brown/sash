description: Claude temp-file cleanup

sources:
  - https://github.com/anthropics/claude-code/issues/24787

bugs:
  bug00:
    description: some/dir may already exist as a file
    code: cmd_expected_path_state
    shellcheck: null
  bug01:
    description: some/dir/newfile.cpp is deleted without ever being used
    code: data_loss
    shellcheck: null

ground_truths:
  - path: original.sh
    kind: original
    bugs:
      bug00: {lines: [3]}
      bug01: {lines: [6]}

  - path: posix.sh
    kind: buggy
    bugs:
      bug00: { lines: [3] }
      bug01: { lines: [6] }

  - path: fixed.sh
    kind: fixed
    bugs:
      bug00: { regression_lines: [3], shellcheck: null }
      bug01: { regression_lines: [6], shellcheck: null }
