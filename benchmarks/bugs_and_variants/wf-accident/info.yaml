description: Accidental recursive delete

sources:
  - https://www.hivelocity.net/blog/human-error-is-the-leading-cause-of-business-data-loss/
  - https://unix.stackexchange.com/questions/101237/how-to-recover-files-i-deleted-now-by-running-rm

bugs:
  bug00:
    description: argument may become '*' and not exist
    code: cmd_expected_path_state
    shellcheck: null
  bug01:
    description: deletes everything in PWD
    code: del_sys_file
    shellcheck: null

ground_truths:
  - path: original.sh
    kind: original
    bugs:
      bug00: { lines: [4] }
      bug01: { lines: [3, 4] }

  - path: posix.sh
    kind: buggy
    bugs:
      bug00: { lines: [3] }
      bug01: { lines: [2, 3] }

  - path: fixed.sh
    kind: fixed
    bugs:
      bug00: {regression_lines: [3], shellcheck: null}
      bug01: {regression_lines: [2, 3], shellcheck: null}
